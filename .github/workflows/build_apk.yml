name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Pre-install Pure Python Dependencies into src/
        run: |
          python -m pip install --upgrade pip
          pip install flet
          
          # Clean old cache and requirements
          rm -rf src/site-packages src/requirements.txt requirements.txt
          
          # Install lightweight Pure-Python libraries directly
          pip install requests ccxt pillow openpyxl --target src/

      - name: Build Android APK
        run: |
          flet build apk src --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SniperBot-APK
          path: |
            build/apk/*.apk
            dist/*.apk
            build/android/apk/*.apk
            **/*.apk